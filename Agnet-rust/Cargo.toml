[package]
name = "aagnet"
version = "0.1.0"
edition = "2021"
description = "aagnet — 微内核 Agent 框架 v2。核心只提供 Slot/Pipeline/AgentRuntime 接口，所有业务功能通过插件实现。"
readme = "README.md"
repository = "https://github.com/example/aagnet"
keywords = ["agent", "llm", "ai", "framework", "microkernel"]
categories = ["development-tools", "web-programming"]

[dependencies]
tokio = { version = "1", features = ["sync", "fs", "rt", "rt-multi-thread", "time", "macros", "process", "io-std"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
thiserror = "1"
regex = "1"
async-trait = "0.1"
futures = "0.3"
toml = "0.8"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }


[features]
default = ["vector_db"]
vector_db = []
